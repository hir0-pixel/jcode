[package]
name = "sovereign-prime"
version = "0.1.0"
edition = "2024"
publish = false
description = "Prime-style recursive REPL and continual harness for the sovereign engine"

[dependencies]
anyhow = "1"
jcode-storage = { path = "../jcode-storage" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process", "io-util", "sync", "time", "rt", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_yaml = "0.9"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
