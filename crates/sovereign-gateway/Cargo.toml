[package]
name = "sovereign-gateway"
version = "0.1.0"
edition = "2024"
publish = false
description = "Hermes tui_gateway-compatible HTTP/WebSocket front end for the jcode harness API"

[dependencies]
anyhow = "1"
futures-util = "0.3"
httparse = "1"
jcode-command-risk = { path = "../jcode-command-risk" }
jcode-harness-api-server = { path = "../jcode-harness-api-server" }
sovereign-prime = { path = "../sovereign-prime" }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
jcode-provider-core = { path = "../jcode-provider-core" }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time", "process"] }
tokio-tungstenite = "0.24"

[dev-dependencies]
jsonschema = { version = "0.49", default-features = false }
